[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carusen-reuse"
version = "0.1.0"
description = "计算重复使用的提示词比例，并标出被改得面目全非的热门模板"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "carusen" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://carusen.github.io"
Repository = "https://github.com/carusen/reuse"
Issues = "https://github.com/carusen/reuse/issues"

[project.scripts]
reuse = "reuse:main"

[tool.setuptools]
py-modules = ["reuse"]
